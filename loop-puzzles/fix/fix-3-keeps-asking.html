<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden gate</title>
  </head>
  <body>
    <h1>Garden gate</h1>
    <script>
      /* Asks for the gate word up to three times,
         and stops as soon as the answer is right. */
      var gateWord = "harbour";
      var message = "The gate stays shut";
      for (var i = 1; i <= 3; i++) {
        var answer = prompt("Attempt " + i + " of 3: enter the gate word");
        if (answer === gateWord) {
          message = "The gate opens";
          break
        }
      }
      document.write(message);
    </script>
  </body>
</html>
