<!DOCTYPE html>

    <title>Count to six</title>
  </head>
  <body>
    <h1>Count to six</h1>
    <script>
      // Count from 1 up to the last number
      var lastNumber = 6;
      for (var i = 1; i < lastNumber; i++) {
        document.write(i + "<br>");
      }
    </script>
  </body>
