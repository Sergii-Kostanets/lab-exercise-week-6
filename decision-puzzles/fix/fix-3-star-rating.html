<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star rating</title>
  </head>
  <body>
    <h1>Star rating</h1>
    <script>
      // A rating is from 1 to 5 stars
      var stars = 7;
      if (stars < 1 || stars > 5) {
        document.write("That is not a valid rating");
      } else if (stars >= 4) {
        document.write("Loved it");
      } else {
        document.write("Could be better");
      }
    </script>
  </body>
</html>
