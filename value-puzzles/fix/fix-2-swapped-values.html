    <title>Change</title>

  <body>
    <h1>Change</h1>
    <script>
      // How much change is owed: the amount paid minus the cost
      function getChange(paid, cost) {
        return paid - cost;
      }
      var cost = 13;
      var paid = 20;
      document.write("Change: " + getChange(cost, paid));
    </script>
  </body>
