  <body>
    <h1>Exam result</h1>
    <script>
      /* Gives back the result for an exam score:
         forty or more is a pass. */
      function getResult(score) {
        if (score >= 40) {
          return "You passed";
        } else {
          return "Try again";
        }
      }
      var examScore = 65;
      document.write(getResult(examScore));
    </script>
  </body>
