<!DOCTYPE html>
<html lang="en">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floors</title>
    </head>
    <body>
        <h1>Lighthouse floors</h1>
        <script>
            // This loop writes the lighthouse floors from 1 to 5.
            var lastFloor = Number(prompt("How many floors does the lighthouse have?"));
            for (var i = 1; i <= lastFloor; i++) {
                document.write("Floor " + i + "<br>");
            }
        </script>
    </body>
</html>
