        <title>Opening hours</title>

    <body>
        <h1>Opening hours</h1>
        <script>
            // This page checks whether the shop is open at the specified hour.
            var hour = 17;
            if (hour >= 9 && hour < 17) {
                document.write("The shop is open");
            } else {
                document.write("The shop is closed");
            }
        </script>
    </body>
