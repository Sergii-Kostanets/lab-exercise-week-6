        <title>Opening hours</title>

    <body>
        <h1>Opening hours</h1>
        <script>
            // This page checks whether the shop is closed at the specified hour.
            var hour = 8;
            if (hour < 9 || hour >= 17) {
                document.write("Closed");
            } else {
                document.write("Open");
            }
        </script>
    </body>
