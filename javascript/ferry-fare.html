<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ferry fare</title>
    </head>
    <body>
        <h1>Ferry fare</h1>
        <script>
            // This page asks for a passenger's age and calculates the ferry fare.
            var age = Number(prompt("Please enter your age"));
            if (age < 0 || age > 120) {
                document.write("That is not a valid age");
            } else if (age < 5) {
                document.write("Free");
            } else if (age < 16) {
                document.write("Child fare");
            } else {
                document.write("Adult fare");
            }
        </script>
    </body>
</html>
