<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: Sergii Kostanets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamp total</title>
  </head>
  <body>
    <h1>Stamp total</h1>
    <button onclick="addStamp()">Add stamp</button>
    <button onclick="showStamps()">Show stamps</button>
    <script>
      // Click Add stamp three times, then Show stamps: the pop-up should say 3
      var stamps = 0;
      function addStamp() {
        stamps = stamps + 1;
      }
      function showStamps() {
        alert(stamps);
      }
    </script>
  </body>
</html>
